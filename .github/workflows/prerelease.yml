name: Pre-release (dev)

# Every push to `dev` that passes the checks publishes a GitHub *pre-release*:
#   tag  v<version in fxmanifest.lua>-dev.<N>      e.g.  v0.3.0-dev.1, v0.3.0-dev.2, ...
# N restarts at 1 whenever the version in fxmanifest.lua changes.
#
# Stable releases are NOT created here. You publish those yourself on GitHub
# (Releases -> Draft a new release, target `main`).

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One run at a time, so two quick pushes can never pick the same pre-release number.
concurrency:
  group: prerelease-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Syntax check (all Lua files)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            luac5.4 -p "$file" || status=1
          done < <(git ls-files -z '*.lua')
          exit "$status"

      - name: Logic tests
        run: lua5.4 tests/bans_spec.lua

  prerelease:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases / tags
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_PRERELEASES: 10 # older "-dev.N" pre-releases are deleted (stable releases are never touched)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need all tags to compute the next number

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base="$(sed -nE "s/^version[[:space:]]+'([^']+)'.*/\1/p" fxmanifest.lua | head -n1)"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::fxmanifest.lua needs a version like 1.2.3 (found: '${base}')"
            exit 1
          fi

          last=0
          while read -r tag; do
            n="${tag#"v${base}-dev."}"
            if [[ "$n" =~ ^[0-9]+$ ]] && (( n > last )); then
              last="$n"
            fi
          done < <(git tag --list "v${base}-dev.*")

          version="${base}-dev.$(( last + 1 ))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Next pre-release: v${version}"

      - name: Build package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # The folder inside the zip MUST be named AY-Core: FiveM uses the folder name as the resource name.
          mkdir -p build
          git archive --format=tar --prefix=AY-Core/ HEAD | tar -x -C build

          # Stamp the pre-release version into the packaged manifest (AY.Version / startup log show it).
          sed -i -E "s/^version[[:space:]]+'[^']+'/version '${VERSION}'/" build/AY-Core/fxmanifest.lua
          grep -q "^version '${VERSION}'" build/AY-Core/fxmanifest.lua

          (cd build && zip -qr "../AY-Core-v${VERSION}.zip" AY-Core)
          unzip -l "AY-Core-v${VERSION}.zip" | tail -n 3

      - name: Publish pre-release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          asset="AY-Core-v${VERSION}.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # re-run of a job that already created the release
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$TAG" \
              --notes "Automated pre-release built from \`dev\` (${GITHUB_SHA::7}). **Not a stable release** - for testing only." \
              --generate-notes
          fi

      - name: Delete old pre-releases
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 300 --json tagName,isPrerelease,createdAt \
            | jq -r --argjson keep "$KEEP_PRERELEASES" '
                [ .[] | select(.isPrerelease and (.tagName | test("-dev\\.[0-9]+$"))) ]
                | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName' \
            | while read -r tag; do
                echo "Deleting old pre-release $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
